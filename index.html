    .genre-picker { position: relative; margin-bottom: 16px; }
    .genre-picker-toggle { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #f3f4f6; color: #222; text-align: left; cursor: pointer; }

    .genre-picker-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; padding: 8px; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 20; }
    .genre-picker-menu[hidden] { display: none; }
    .genre-picker-search { width: 100%; padding: 8px; margin-bottom: 6px; border: 1px solid #d1d5db; border-radius: 6px; }
    .genre-picker-options { max-height: 180px; overflow-y: auto; display: grid; gap: 2px; }
    .genre-picker-option { display: flex; gap: 8px; align-items: center; padding: 7px 6px; border-radius: 5px; cursor: pointer; }
    .genre-picker-option:hover { background: #f3f4f6; }
    .genre-picker-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .genre-picker-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 10px; background: #fff; color: #4b5563; border: 1px solid #9ca3af; font-size: 0.85em; }
    .genre-picker-chip button { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0; border-radius: 50%; padding: 0; background: #e5e7eb; color: #4b5563; cursor: pointer; font-size: 1.1em; line-height: 1; }
    .genre-picker-chip button:hover { background: #d1d5db; color: #111827; }
    .filter-select:hover { background: #e5e7eb; }

    .month-section { margin-bottom: 80px; }

        return [items];
      }

      // The lead row is intentionally smaller, making its tiles slightly wider.
      const rows = [items.slice(0, 2)];
      let index = 2;
      let remaining = count - index;

      // Prefer complete 3/4-item rows. A remainder of five is kept together
      // rather than creating a visually awkward one- or two-item final row.
      while (remaining > 0) {
        let rowSize;
        if (remaining <= 5) {
          rowSize = remaining;
        } else if (remaining % 4 !== 0) {
          rowSize = 3;
        } else {
          rowSize = 4;
        }
        rows.push(items.slice(index, index + rowSize));
        index += rowSize;
        remaining -= rowSize;
      }

      return rows;
    }

    // Mark the first item in each month for special styling
    function markMainItems(data) {
      return data.map(group => {
        const items = group.items.map((item, idx) => ({
          ...item,
          isMain: idx === 0
        }));
        return { ...group, items };
      });
    }

    // Initialize data with main item markers
    DATA = markMainItems(DATA);

    function formatFilterValue(value) {
      return value.split(/[\s_-]+/).map(word => word ? word.charAt(0).toUpperCase() + word.slice(1) : word).join(' ');
    }

    function populateFilterOptions() {
      const items = DATA.flatMap(group => group.items || []);
      const filterDefinitions = [
        {
          id: 'platformFilter',
          emptyLabel: 'All Platforms',
          getValue: item => (item.platform || '').trim().toLowerCase()
        },
        {
          id: 'typeFilter',
          emptyLabel: 'All Types',
          getValue: item => isSubscription(item) ? 'subscription' : (item.type || '').trim().toLowerCase()
        },
        {
          id: 'genreFilter',
          emptyLabel: 'All Genres',
          getValue: item => item.type?.trim().toLowerCase() === 'game' ? (Array.isArray(item.genre) ? item.genre : [item.genre || '']).map(value => value.trim().toLowerCase()) : []
        }
      ];

      filterDefinitions.forEach(({ id, emptyLabel, getValue }) => {
        const select = document.getElementById(id);
        const values = [...new Set(items.flatMap(getValue).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        select.replaceChildren(new Option(emptyLabel, ''));
        values.forEach(value => select.add(new Option(formatFilterValue(value), value)));
      });

      renderGenrePicker();
    }

    function renderGenrePicker() {
      const select = document.getElementById('genreFilter');
      const optionsContainer = document.getElementById('genrePickerOptions');
      const selectedValues = new Set([...select.selectedOptions].map(option => option.value).filter(Boolean));
      optionsContainer.innerHTML = [...select.options].slice(1).map(option => `
        <label class="genre-picker-option">
          <input type="checkbox" value="${option.value}" ${selectedValues.has(option.value) ? 'checked' : ''}>
          <span>${option.textContent}</span>
        </label>
      `).join('') || '<span class="genre-picker-option">No genres available</span>';
      updateGenrePickerLabel();
    }

    function updateGenrePickerLabel() {
      const select = document.getElementById('genreFilter');
      const toggle = document.getElementById('genrePickerToggle');
      const selected = [...select.selectedOptions].filter(option => option.value);
      if (!selected.length) {
        toggle.textContent = 'All Genres';
        return;
      }
      toggle.innerHTML = `<span class="genre-picker-chips">${selected.map(option => `<span class="genre-picker-chip">${option.textContent}<button type="button" data-remove-genre="${option.value}" aria-label="Remove ${option.textContent}">&times;</button></span>`).join('')}</span>`;
    }

    function applyGenrePickerSelection() {
      const select = document.getElementById('genreFilter');
      const checkedValues = new Set([...document.querySelectorAll('#genrePickerOptions input:checked')].map(input => input.value));
      [...select.options].forEach(option => { option.selected = option.value ? checkedValues.has(option.value) : checkedValues.size === 0; });
      updateGenrePickerLabel();
      applyFilters();
    }

    populateFilterOptions();

    // --- Render all sections at once, filter dynamically ---
    function renderSections(filteredData) {
      const container = document.getElementById('gameSections');
      const groupsWithItems = filteredData.filter(group => group.items && group.items.length > 0);
      if (!groupsWithItems.length) {
        container.innerHTML = '<div style="color:#888; padding: 40px; text-align: center;">No games found.</div>';
        updateMonthLinks([]);
        return;
      }
      container.innerHTML = groupsWithItems.map(group => {
        const rows = groupItemsIntoRows(group.items);
        return `
          <section id="${group.month.replace(/\s+/g, '_')}" class="month-section">
            <div class="month-banner"><h2>${group.month}</h2></div>
            <div class="grid">
              ${rows.map(row => `
                <div class="grid-row" style="grid-template-columns: repeat(${row.length}, minmax(0, 1fr));">
                  ${row.map(item => renderGridItem(item)).join('')}
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');
      
      // Observe all month sections for scroll highlighting
      document.querySelectorAll('.month-section').forEach(section => observer.observe(section));
      updateMonthLinks(groupsWithItems);
    }

    function renderGridItem(item) {
      // Detect subscription
      const isSubscriptionItem = isSubscription(item);
      
      // Fix Humble links for first month if needed
      let url = item.url || '';
      if (url && url.includes('/home/')) {
        const monthSlug = (item.month || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        url = url.replace('/home/', `/${monthSlug}/`);
      }
      
      const mainClass = item.isMain ? 'main-item' : '';
      const platformLower = (item.platform || '').toLowerCase();
      const typeLower = isSubscriptionItem ? 'subscription' : (item.type || '').toLowerCase();
      const genres = Array.isArray(item.genre) ? item.genre : (item.genre ? [item.genre] : []);
      const genreLower = genres.map(genre => genre.toLowerCase());
      
      return `<div class="grid-item ${mainClass}" data-platform="${platformLower}" data-type="${typeLower}" data-genre="${genreLower}">
        <a href="${url}" target="_blank">
          <img class="choice-image" src="${item.image}" alt="${item.title}">
          <div class="content-choice-title">${item.title}</div>
          <div class="delivery-methods">
            ${renderPlatformIcon(item.platform)}
            ${isSubscriptionItem ? `<span class="badge subscription">Subscription</span>` : (item.type ? `<span class="badge">${formatFilterValue(item.type)}</span>` : '')}
            ${item.hasTimeLimit ? `<span class="badge time-limit" title="${item.timeLimitText || 'Time-limited redemption'}"><i class="fa-solid fa-clock" aria-hidden="true"></i> Expires</span>` : ''}
            ${genres.map(genre => `<span class="badge genre-badge">${formatFilterValue(genre)}</span>`).join('')}
          </div>
        </a>
      </div>`;
    }

    function renderPlatformIcon(platform) {
      if (!platform) return '';
      const platformLower = platform.toLowerCase();
      const icons = {
        steam: ['steam', 'Steam'],
        gog: ['gogdotcom', 'GOG'],
        ubisoft: ['ubisoft', 'Ubisoft'],
        epic: ['epicgames', 'Epic'],
        blizzard: ['blizzard', 'Blizzard'],
        'battle.net': ['battledotnet', 'Battle.net'],
        origin: ['ea', 'EA/Origin'],
        ea: ['ea', 'EA'],
        xbox: ['xbox', 'Xbox'],
        playstation: ['playstation', 'PlayStation'],
        nintendo: ['nintendo', 'Nintendo']
      };
      const icon = icons[platformLower];
      return icon ? `<span class="platform-badge"><img class="platform-logo" src="https://cdn.simpleicons.org/${icon[0]}" alt="${icon[1]}" title="${icon[1]}"></span>` : `<span class="badge platform-icon">${formatFilterValue(platform)}</span>`;
    }

    function updateMonthLinks(filteredData) {
      const links = (filteredData || DATA).map(group => `<a href="#${group.month.replace(/\s+/g, '_')}" data-month="${group.month.replace(/\s+/g, '_')}">${group.month}</a>`).join('');
      document.getElementById('monthLinks').innerHTML = links;
    }

    function updateActiveMonth(entries) {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const monthId = entry.target.id;
          document.querySelectorAll('#monthLinks a').forEach(link => {
            link.classList.toggle('active', link.dataset.month === monthId);
          });
        }
      });
    }



    // --- Filtering ---
    function applyFilters() {
      const search = document.getElementById('searchBox').value.toLowerCase();
      const platformFilter = document.getElementById('platformFilter').value.toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value.toLowerCase();
      const genreFilter = [...document.getElementById('genreFilter').selectedOptions].map(option => option.value.toLowerCase()).filter(Boolean);
      
      const filtered = DATA.map(group => {
        const items = group.items.filter(item => {
          let show = true;
          
          // Search filter
          if (search && !item.title.toLowerCase().includes(search)) {
            show = false;
          }
          
          // Platform filter
          if (platformFilter) {
            const itemPlatform = (item.platform || '').toLowerCase();
            if (itemPlatform !== platformFilter) {
              show = false;
            }
          }
          
          // Type filter with subscription detection
          if (typeFilter) {
            const itemType = isSubscription(item) ? 'subscription' : (item.type || '').toLowerCase();
            if (itemType !== typeFilter) {
              show = false;
            }
          }
          
          // Genre filter
          if (genreFilter.length) {
            const itemGenres = Array.isArray(item.genre) ? item.genre : (item.genre ? [item.genre] : []);
            if (!itemGenres.some(genre => genreFilter.includes(genre.toLowerCase()))) {
              show = false;
            }
          }
          
          return show;
        });
        return { ...group, items };
      }).filter(group => group.items.length > 0);
      
      renderSections(filtered);
    }

    const menuToggle = document.getElementById('menuToggle');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const sidebar = document.querySelector('aside');

    function setSidebarOpen(isOpen) {
      sidebar.classList.toggle('open', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    }

    menuToggle.addEventListener('click', () => setSidebarOpen(true));
    closeMenuBtn.addEventListener('click', () => setSidebarOpen(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setSidebarOpen(false);
    });

    document.getElementById('searchBox').addEventListener('input', function() {
      document.getElementById('clearSearchBtn').style.display = this.value ? 'block' : 'none';
      applyFilters();
    });
    
    document.getElementById('clearSearchBtn').addEventListener('click', function() {
      document.getElementById('searchBox').value = '';
      this.style.display = 'none';
      applyFilters();
      document.getElementById('searchBox').focus();
    });
    
    document.getElementById('platformFilter').addEventListener('change', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);
    document.getElementById('genrePickerToggle').addEventListener('click', () => {
      const menu = document.getElementById('genrePickerMenu');
      const isOpen = menu.hasAttribute('hidden');
      menu.toggleAttribute('hidden', !isOpen);
      document.getElementById('genrePickerToggle').setAttribute('aria-expanded', String(isOpen));
      if (isOpen) document.getElementById('genrePickerSearch').focus();
    });
    document.getElementById('genrePickerToggle').addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        event.currentTarget.click();
      }
    });
    document.getElementById('genrePickerOptions').addEventListener('change', applyGenrePickerSelection);
    document.getElementById('genrePickerSearch').addEventListener('input', event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll('#genrePickerOptions .genre-picker-option').forEach(option => {
        option.hidden = !option.textContent.toLowerCase().includes(query);
      });
    });
    document.getElementById('genrePickerToggle').addEventListener('click', event => {
      const removeButton = event.target.closest('[data-remove-genre]');
      if (!removeButton) return;
      event.stopPropagation();
      const checkbox = document.querySelector(`#genrePickerOptions input[value="${CSS.escape(removeButton.dataset.removeGenre)}"]`);
      if (checkbox) {
        checkbox.checked = false;
        applyGenrePickerSelection();
      }
    });
    document.addEventListener('click', event => {
      const picker = document.getElementById('genrePicker');
      if (!picker.contains(event.target)) {
        document.getElementById('genrePickerMenu').setAttribute('hidden', '');
        document.getElementById('genrePickerToggle').setAttribute('aria-expanded', 'false');
      }
    });

    const lastUpdatedDate = new Date(window.UNCLAIMED_HUMBLE_GAMES_UPDATED_AT || document.lastModified);
    document.getElementById('lastUpdated').textContent = `Last updated: ${lastUpdatedDate.toLocaleString()}`;

    // --- Initial render ---
    renderSections(DATA);
  </script>
</body>
</html>
