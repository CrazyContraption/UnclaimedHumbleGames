name: Humble Scraper

on:
  workflow_dispatch: # manual trigger
  schedule:
    # GitHub cron format: minute hour day month day-of-week
    # Runs at 06:00 UTC on the first Wednesday of each month
    # Cron: https://crontab.guru/#0_6_*_*_3
    # But "first Wednesday" cannot be expressed exactly; run every Wednesday, filter in JS if needed
    - cron: '0 6 1-7 * 3'  # first Wednesday approximation
    # Bonus: if first Wednesday can't be deduced, just run on 10th
    #- cron: '0 6 10 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # required to push to gh-pages

      # 2️⃣ Setup Node
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - run: |
          npm install
          npx playwright install --with-deps

      # 4️⃣ Restore Humble auth
      - run: |
          echo "${{ secrets.HUMBLEAUTHSTATE }}" | base64 --decode > auth.json

      # 5️⃣ Run scraper
      - run: |
          node scrape.js

      # 6️⃣ Switch to gh-pages branch
      - run: |
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages

      # 7️⃣ Copy generated HTML (or full site) into branch
      - run: |
          cp ../index.html ./index.html  # adjust path if needed

      # 8️⃣ Commit only if changed
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Humble index [ci skip]"
            git push origin gh-pages
          else
            echo "No changes, skipping push"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
