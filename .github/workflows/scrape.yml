name: Humble Scraper

on:
  workflow_dispatch: # manual trigger
  schedule:
    # GitHub cron format: minute hour day month day-of-week
    # Runs at 06:00 UTC on the first Wednesday of each month
    # Cron: https://crontab.guru/#0_6_*_*_3
    # But "first Wednesday" cannot be expressed exactly; run every Wednesday, filter in JS if needed
    - cron: '0 6 * * WED'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # required to push to gh-pages
          persist-credentials: true

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install Dependancies
        run: |
          npm install
          npx playwright install --with-deps

      # 4️⃣ Restore Humble auth
      - name: Retreive Auth State
        run: |
          echo "${{ secrets.HUMBLEAUTHSTATE }}" | base64 --decode > auth.json

      # 5️⃣ Run scraper
      - name: Scrape Humble Games
        run: |
          node scrape.js

      # 6️⃣ Switch to gh-pages branch
      - name: Setup Git Configurations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || echo "No gh-pages branch yet"
          git checkout --orphan gh-pages || git checkout gh-pages || git checkout -b gh-pages
          git rm -rf .

      # 7️⃣ Copy generated HTML (or full site) into branch
      - name: Organize File Structure
        run: |
          cp ../index.html ./index.html  # adjust path if needed
          git add index.html

      # 8️⃣ Commit only if changed
      - name: Commit Index Diff (if any)
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "Update games index"
            git push origin gh-pages --force
          else
            echo "No changes, skipping push"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
