name: Humble Scraper

on:
  workflow_dispatch: # manual trigger
  schedule:
    # GitHub cron format: minute hour day month day-of-week
    # Runs at 06:00 UTC on the first Wednesday of each month
    # Cron: https://crontab.guru/#0_6_*_*_3
    # But "first Wednesday" cannot be expressed exactly; run every Wednesday, filter in JS if needed
    - cron: '0 6 * * WED'

permissions:
  contents: write

jobs:
  Runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # required to push to gh-pages
          persist-credentials: true

      - name: Cache Node Dependancies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Playwright Dependancies
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependancies
        run: |
          npm install
          npx playwright install --with-deps

      - name: Retreive Auth State
        run: |
          echo "${{ secrets.HUMBLEAUTHSTATE }}" | base64 --decode > auth.json

      - name: Scrape Humble Games
        run: |
          node scrape.js

      - name: Setup Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || echo "No gh-pages branch yet"
          git checkout --orphan gh-pages || git checkout gh-pages || git checkout -b gh-pages- name: Clean branch except index.html
          
      - name: Clean Branch
        run: |
          git rm -rf --cached .
          
          # Restore index.html to staging
          git reset index.html

          # Delete all other files from filesystem
          shopt -s extglob
          rm -rf !(index.html)
          shopt -u extglob

      - name: Commit Index Diff (if any)
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "Update games index"
            git push origin gh-pages --force
          else
            echo "No changes, skipping push"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
